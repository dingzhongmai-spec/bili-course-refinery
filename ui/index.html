<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程炼化 · Course Refinery</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1e293b;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:30px;margin:0}h2{font-size:21px}p{line-height:1.7;color:#475569}.card{background:white;border:1px solid #dae2e8;border-radius:16px;padding:26px;margin-top:22px}.drop{display:block;border:2px dashed #9daebe;background:#f8fafc;border-radius:12px;text-align:center;padding:24px;cursor:pointer}.drop:focus-within{outline:3px solid #8bbdc5}.drop img{max-height:300px;max-width:100%;display:block;margin:15px auto}textarea{display:block;width:100%;min-height:110px;border:1px solid #94a3b8;border-radius:8px;padding:12px;font:inherit;margin:10px 0 18px}button,select{font:inherit;padding:10px 18px;border:1px solid #bac7d1;border-radius:8px;background:white;cursor:pointer}button.primary{background:#176b67;color:white;border-color:#176b67}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:12px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:16px;max-height:380px;overflow:auto;line-height:1.5;font-size:13px}#message{margin-top:14px;color:#176b67;white-space:pre-wrap}.error{color:#b42318!important}a{color:#176b67}label{line-height:1.7}.small{font-size:13px}#history button{margin:4px} [hidden]{display:none!important}@media(max-width:600px){main{padding:20px 12px}.card{padding:18px}header{align-items:flex-start}h1{font-size:23px}}
</style></head><body><main>
<header><h1 data-zh="课程炼化" data-en="Course Refinery">课程炼化</h1><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></header>
<p data-zh="从一张截图开始，整理成有来源、方法解释和完整推导的讲义。" data-en="Start with a screenshot. Build source-backed course notes with method explanations and derivations.">从一张截图开始，整理成有来源、方法解释和完整推导的讲义。</p>
<section class="card"><h2 data-zh="1. 上传或粘贴截图" data-en="1. Upload or paste a screenshot">1. 上传或粘贴截图</h2>
<label class="drop" id="drop"><span data-zh="选择图片、拖入图片，或按 Ctrl+V 粘贴截图" data-en="Choose an image, drag it here, or paste with Ctrl+V">选择图片、拖入图片，或按 Ctrl+V 粘贴截图</span><br><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" alt="Screenshot preview" hidden></label>
<p class="small" data-zh="课程页、作者主页或合集截图均可。若上传工具仓库截图，请补充课程对象。" data-en="Use a course, author or playlist screenshot. If it only shows a tool repository, specify the course below.">课程页、作者主页或合集截图均可。若上传工具仓库截图，请补充课程对象。</p>
<label for="request" data-zh="整理要求（可选）" data-en="Course request (optional)">整理要求（可选）</label><textarea id="request" placeholder="例如：整理该作者的非数竞赛新系列，面向高数基础读者，输出中文PDF。"></textarea>
<div class="actions"><button class="primary" id="start" disabled data-zh="开始整理" data-en="Start refining">开始整理</button><button id="prepare" disabled data-zh="仅生成桌面版任务" data-en="Prepare desktop task">仅生成桌面版任务</button></div>
<p id="environment" class="small"></p><div id="message" role="status" aria-live="polite"></div></section>
<section id="result" class="card" hidden><h2 data-zh="2. 任务进度与结果" data-en="2. Progress and results">2. 任务进度与结果</h2><p id="state"></p><p id="directory" class="small"></p><div class="actions"><button id="copy" data-zh="复制桌面版指令" data-en="Copy desktop prompt">复制桌面版指令</button><a id="pdf" hidden target="_blank" data-zh="打开PDF" data-en="Open PDF">打开PDF</a><a id="tex" hidden target="_blank" data-zh="下载TeX" data-en="Download TeX">下载TeX</a></div><p class="small" data-zh="桌面版：把指令和原截图放入Codex对话。CLI结果表示执行状态，内容验收以审阅记录为准。" data-en="Desktop: attach the original screenshot and paste the prompt in Codex. Process completion does not certify content review.">桌面版：把指令和原截图放入Codex对话。CLI结果表示执行状态，内容验收以审阅记录为准。</p><pre id="output"></pre><details><summary data-zh="查看执行日志" data-en="Execution log">查看执行日志</summary><pre id="log"></pre></details></section>
<section class="card"><h2 data-zh="最近任务" data-en="Recent tasks">最近任务</h2><div id="history"></div></section>
<p class="small">采集 / Acquisition: <a href="https://github.com/NANblogink/bilibilidownloadtool" target="_blank" rel="noreferrer">NANblogink/bilibilidownloadtool</a> · FFmpeg · faster-whisper</p>
</main><script>
const token=new URLSearchParams(location.search).get('token');let imageData='',current='',prompt='',timer=null;
const $=id=>document.getElementById(id),en=()=>$('language').value==='en';
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Local-Token':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function message(t,error=false){$('message').textContent=t;$('message').classList.toggle('error',error)}
async function select(file){if(!file)return;if(file.size>12*1024*1024){message(en()?'Maximum image size: 12 MB':'截图最大12MB',true);return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;$('preview').src=imageData;$('preview').hidden=false;$('start').disabled=false;$('prepare').disabled=false;message(en()?'Screenshot ready':'截图已就绪')};reader.readAsDataURL(file)}
$('image').onchange=e=>select(e.target.files[0]);document.addEventListener('paste',e=>{const item=[...e.clipboardData.items].find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();select(item.getAsFile())}});$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();select(e.dataTransfer.files[0])};
async function history(){const items=await api('/api/tasks');$('history').replaceChildren();for(const t of items){const b=document.createElement('button');b.textContent=t.id.slice(0,8)+' · '+t.status;b.onclick=()=>{current=t.id;poll()};$('history').append(b)}}
async function poll(){clearTimeout(timer);try{const d=await api('/api/task/'+current);prompt=d.prompt;$('result').hidden=false;const status={ready:en()?'Ready':'已准备',running:en()?'Running':'执行中',finished:en()?'Execution finished':'执行结束',failed:en()?'Execution failed; see log':'执行失败，请查看日志'};$('state').textContent=(en()?'Status: ':'状态：')+(status[d.status]||d.status);$('directory').textContent=d.directory;$('output').textContent=d.result||(d.status==='ready'?d.prompt:(en()?'Working…':'正在执行…'));$('log').textContent=d.log||d.error||'';for(const ext of ['pdf','tex']){$(ext).hidden=!d.has_pdf;$(ext).href='/artifact/'+current+'/'+ext+'?token='+encodeURIComponent(token)}if(d.status==='running')timer=setTimeout(poll,2500)}catch(e){message(e.message,true)}}
async function create(run){$('start').disabled=true;$('prepare').disabled=true;try{const t=await api('/api/task',{image:imageData,request:$('request').value,language:$('language').value});current=t.id;if(run){await api('/api/run',{id:current});message(en()?'Codex started. Results will appear below.':'Codex已启动，进度会显示在下方。')}else message(en()?'Desktop task saved. Copy the prompt below.':'桌面版任务已保存，可复制下方指令。');await poll();await history()}catch(e){message(e.message,true);if(current){await poll();await history()}}finally{$('start').disabled=false;$('prepare').disabled=false}}
$('start').onclick=()=>create(true);$('prepare').onclick=()=>create(false);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(prompt);message(en()?'Prompt copied; attach the original screenshot too.':'指令已复制，请同时附上原截图。')}catch(e){message(e.message,true)}};
async function language(){document.documentElement.lang=en()?'en':'zh-CN';localStorage.setItem('refinery-language',$('language').value);document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[en()?'en':'zh']);$('request').placeholder=en()?'Example: refine the author’s new mathematics contest series for calculus learners; deliver an English PDF.':'例如：整理该作者的非数竞赛新系列，面向高数基础读者，输出中文PDF。';message('');const d=await api('/api/environment');$('environment').textContent=d.codex_available?(en()?'Codex CLI detected. Uses your existing sign-in and model settings.':'已检测到Codex CLI，将使用现有登录与模型设置。'):(en()?'Codex CLI unavailable. Prepare a desktop task or install and sign in to the CLI.':'未检测到Codex CLI，可生成桌面版任务，或安装CLI并登录。');if(current)await poll()}
$('language').value=localStorage.getItem('refinery-language')||'zh';$('language').onchange=language;language().catch(e=>message(e.message,true));history().catch(e=>message(e.message,true));
</script></body></html>
